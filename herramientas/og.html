<!DOCTYPE html>
<!-- Plantilla de la imagen para compartir (1200x630). Ver README: "Regenerar la imagen para compartir". -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f7f5f1; color: #2b2a27;
    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 64px;
    padding: 0 90px; box-sizing: border-box; border-top: 14px solid #1e2d42; border-bottom: 14px solid #2f6b4f;
  }
  img { width: 300px; height: 300px; border-radius: 50%; object-fit: cover; transform: scale(1); clip-path: circle(47%); border: 6px solid #eeeae3; }
  .nombre { font-size: 28px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #24543e; margin: 0 0 18px; }
  h1 { font-family: "Palatino Linotype", Palatino, Georgia, serif; font-size: 62px; line-height: 1.12; color: #1e2d42; margin: 0 0 24px; font-weight: 600; }
  p { font-size: 30px; line-height: 1.35; color: #5b5852; margin: 0; }
</style>
</head>
<body>
  <img src="../assets/foto-perfil.png" alt="">
  <div>
    <p class="nombre">Roberto Guerrero</p>
    <h1>Sistemas para negocios en San Nicolás y Monterrey</h1>
    <p>Inventario, ventas, órdenes y citas desde el celular. Diagnóstico gratis.</p>
  </div>
</body>
</html>
